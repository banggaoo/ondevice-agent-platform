[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ondevice-agent-platform"
version = "0.2.0"
description = "Local-first, deterministic agent and model serving platform"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.optional-dependencies]
mlx = ["mlx-lm>=0.28"]

[project.scripts]
ondevice-agent-platform = "ondevice_agent_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ondevice_agent_platform = ["console/*"]
